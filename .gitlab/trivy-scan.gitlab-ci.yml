# =============================================================================
# TRIVY CONTAINER SECURITY SCAN
# =============================================================================
# Scheduled weekly scan of production container images for vulnerabilities.
# 
# Setup in GitLab:
# 1. Go to CI/CD > Schedules
# 2. Create new schedule:
#    - Description: "Weekly Trivy Security Scan"
#    - Interval: 0 6 * * 0 (Every Sunday at 6:00 AM)
#    - Target branch: main
#    - Active: Yes
# 3. Add variable (optional): DISCORD_SECURITY_WEBHOOK for notifications
#
# Baseline approach:
# - Stores vulnerability count baseline
# - Only alerts when NEW vulnerabilities are discovered
# - Reports expire after 30 days
# =============================================================================

stages:
  - scan

variables:
  TRIVY_VERSION: "0.59.1"
  TRIVY_SEVERITY: "HIGH,CRITICAL,MEDIUM"
  TRIVY_NO_PROGRESS: "true"
  TRIVY_CACHE_DIR: ".trivycache/"
  REGISTRY: $CI_REGISTRY/kanaliiga_public/kanahub/eggosystem
  GIT_STRATEGY: none

.trivy-scan-base:
  stage: scan
  image: docker:28.2.2-alpine3.21
  services:
    - name: docker:28.2.2-dind-alpine3.21
      alias: docker
  before_script:
    - apk add --no-cache curl jq
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    # Download Trivy
    - curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin v${TRIVY_VERSION}
    - trivy --version
  cache:
    key: trivy-cache
    paths:
      - .trivycache/
  artifacts:
    when: always
    expire_in: 30 days
    reports:
      container_scanning: trivy-report.json
    paths:
      - trivy-report.json
      - trivy-summary.txt
      - vulnerability-count.txt
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"

# =============================================================================
# SCAN PRODUCTION BACKEND IMAGE
# =============================================================================
trivy-scan:backend:
  extends: .trivy-scan-base
  script:
    - IMAGE="$REGISTRY/eggo-backend:latest"
    - echo "🔍 Scanning production backend image: $IMAGE"
    - docker pull $IMAGE
    
    # Generate full JSON report for GitLab integration
    - trivy image --exit-code 0 --format json --output trivy-report.json $IMAGE
    
    # Generate summary report
    - trivy image --exit-code 0 --severity $TRIVY_SEVERITY --output trivy-summary.txt $IMAGE
    
    # Count vulnerabilities by severity
    - |
      CRITICAL=$(cat trivy-report.json | jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length')
      HIGH=$(cat trivy-report.json | jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH")] | length')
      MEDIUM=$(cat trivy-report.json | jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "MEDIUM")] | length')
      TOTAL=$((CRITICAL + HIGH + MEDIUM))
      
      echo "CRITICAL=$CRITICAL" > vulnerability-count.txt
      echo "HIGH=$HIGH" >> vulnerability-count.txt
      echo "MEDIUM=$MEDIUM" >> vulnerability-count.txt
      echo "TOTAL=$TOTAL" >> vulnerability-count.txt
      
      echo ""
      echo "╔══════════════════════════════════════════════════════════════╗"
      echo "║           BACKEND VULNERABILITY SUMMARY                      ║"
      echo "╠══════════════════════════════════════════════════════════════╣"
      echo "║  🔴 CRITICAL: $CRITICAL                                      "
      echo "║  🟠 HIGH:     $HIGH                                          "
      echo "║  🟡 MEDIUM:   $MEDIUM                                        "
      echo "║  📊 TOTAL:    $TOTAL                                         "
      echo "╚══════════════════════════════════════════════════════════════╝"
      echo ""
    
    # Send Discord notification if webhook is configured and vulnerabilities found
    - |
      if [ -n "$DISCORD_SECURITY_WEBHOOK" ] && [ "$TOTAL" -gt 0 ]; then
        echo "📤 Sending Discord notification..."
        PAYLOAD=$(cat <<EOF
      {
        "embeds": [{
          "title": "🛡️ Trivy Security Scan: Backend",
          "color": $([ "$CRITICAL" -gt 0 ] && echo "16711680" || echo "16744448"),
          "fields": [
            {"name": "🔴 Critical", "value": "$CRITICAL", "inline": true},
            {"name": "🟠 High", "value": "$HIGH", "inline": true},
            {"name": "🟡 Medium", "value": "$MEDIUM", "inline": true}
          ],
          "footer": {"text": "Scheduled scan - $CI_PIPELINE_URL"},
          "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
        }]
      }
      EOF
        )
        curl -H "Content-Type: application/json" -d "$PAYLOAD" "$DISCORD_SECURITY_WEBHOOK" || true
      fi
    
    # Show detailed report
    - cat trivy-summary.txt
    
    # Fail if CRITICAL vulnerabilities with available fixes
    - |
      if [ "$CRITICAL" -gt 0 ]; then
        echo "⚠️ CRITICAL vulnerabilities found! Review required."
        exit 1
      fi
  allow_failure: true  # Don't block, but mark as failed for visibility

# =============================================================================
