services:
  devcontainer:
    build: .
    container_name: devcontainer
    volumes:
      - ..:/workspace
    env_file: "../dev.env"
    command: sleep infinity

  eggo-devdb:
    extends:
      file: ../docker-compose.yml
      service: eggo-devdb

  eggo-phpmyadmin:
    extends:
      file: ../docker-compose.yml
      service: eggo-phpmyadmin