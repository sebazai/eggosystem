deploy:
  image: alpine:latest
  stage: deploy
  extends: [.main-all-app]
  environment:
    name: production # This enables GitLab Environments
    url: https://${HUB_PUBLIC_URL}
  variables:
    MARIADB_ROOT_PASSWORD: $MARIADB_ROOT_PASSWORD
    MARIADB_USER: $MARIADB_USER
    MARIADB_PASSWORD: $MARIADB_PASSWORD
    MARIADB_DATABASE: $MARIADB_DATABASE
    DB_HOST: $DB_HOST
    DB_PORT: $DB_PORT
    DB_USER: $DB_USER
    DB_PASSWORD: $DB_PASSWORD
    DB_NAME: $DB_NAME
    SSH_PRIVATE_KEY: $SSH_PRIVATE_KEY
    PROD_SERVER_IP: $PROD_SERVER_IP
    STEAM_API_KEY: $STEAM_API_KEY
    PHPMYADMIN_AUTH_BASE64: $PHPMYADMIN_AUTH_BASE64
  before_script:
    - "which ssh-agent || ( apk update -q && apk add openssh-client gettext rsync -q )"
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | base64 -d | tr -d '\r' | ssh-add - > /dev/null
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan $PROD_SERVER_IP >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - export PHPMYADMIN_AUTH=$(echo $PHPMYADMIN_AUTH_BASE64 | base64 -d)
    - envsubst < docker-compose.prod.yml > docker-compose.prod.subst.yml
    - rsync -v ./docker-compose.prod.subst.yml kanaliiga@$PROD_SERVER_IP:~/docker/eggosystem/docker-compose.yml
    - ssh kanaliiga@$PROD_SERVER_IP "docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY"
    - ssh kanaliiga@$PROD_SERVER_IP "docker compose -f ~/docker/eggosystem/docker-compose.yml pull"
    - ssh kanaliiga@$PROD_SERVER_IP "docker compose -f ~/docker/eggosystem/docker-compose.yml up -d"

deploy-dev:
  image: alpine:latest
  stage: deploy
  rules:
    - if: $CI_MERGE_REQUEST_ID
      when: manual
  needs:
    - job: push-dockerfile:frontend:dev
    - job: push-dockerfile:backend:dev
  environment:
    name: development
    url: https://${HUB_DEV_PUBLIC_URL}
  variables:
    SSH_PRIVATE_KEY: $SSH_PRIVATE_KEY
    PROD_SERVER_IP: $PROD_SERVER_IP
    STEAM_API_KEY: $STEAM_API_KEY
  before_script:
    - "which ssh-agent || ( apk update -q && apk add openssh-client gettext rsync -q )"
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | base64 -d | tr -d '\r' | ssh-add - > /dev/null
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan $PROD_SERVER_IP >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - envsubst < docker-compose.dev.yml > docker-compose.dev.subst.yml
    - rsync -v ./docker-compose.dev.subst.yml kanaliiga@$PROD_SERVER_IP:~/docker/eggosystem-dev/docker-compose.yml
    - ssh kanaliiga@$PROD_SERVER_IP "docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY"
    - ssh kanaliiga@$PROD_SERVER_IP "docker compose -f ~/docker/eggosystem-dev/docker-compose.yml pull"
    - ssh kanaliiga@$PROD_SERVER_IP "docker compose -f ~/docker/eggosystem-dev/docker-compose.yml up -d"

seed-dev:
  image: alpine:latest
  stage: deploy
  rules:
    - if: $CI_MERGE_REQUEST_ID
      when: manual
  needs:
    - job: push-dockerfile:backend:dev
  variables:
    SSH_PRIVATE_KEY: $SSH_PRIVATE_KEY
    PROD_SERVER_IP: $PROD_SERVER_IP
  before_script:
    - "which ssh-agent || ( apk update -q && apk add openssh-client gettext rsync -q )"
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | base64 -d | tr -d '\r' | ssh-add - > /dev/null
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan $PROD_SERVER_IP >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - ssh kanaliiga@$PROD_SERVER_IP "docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY"
    - ssh kanaliiga@$PROD_SERVER_IP "docker compose -f ~/docker/eggosystem-dev/docker-compose.yml pull"
    - ssh kanaliiga@$PROD_SERVER_IP "docker compose -f ~/docker/eggosystem-dev/docker-compose.yml --profile migrate up -d"
    - ssh kanaliiga@$PROD_SERVER_IP "docker compose -f ~/docker/eggosystem-dev/docker-compose.yml --profile seed up -d"
