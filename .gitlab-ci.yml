image: node:26-slim

variables:
  # Docker configuration
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: overlay2
  # Other global variables
  PNPM_HOME: $CI_PROJECT_DIR/.pnpm-store
  PNPM_STORE_PATH: .pnpm-store
  TURBO_TOKEN: $TURBO_TOKEN
  TURBO_TEAM: $TURBO_TEAM
  TRANSFER_METER_FREQUENCY: "10s"
  CACHE_COMPRESSION_LEVEL: "fastest"
  FF_USE_FASTZIP: 1
  # Tag variables for Docker images
  BACKEND_TAG: $CI_COMMIT_SHA
  FRONTEND_TAG: $CI_COMMIT_SHA
  MIGRATIONS_TAG: $CI_COMMIT_SHA
  DOCKER_IMAGE_TAG: 29.4.1-alpine3.23
  DOCKER_DIND_IMAGE_TAG: 29.4.1-dind-alpine3.23
  MARIADB_TAG: 12.2.2

# Define on-demand environment variables
.overwrite-variables: &overwrite-variables
  ENV_ID: mr-${CI_MERGE_REQUEST_IID}
  MARIADB_ROOT_PASSWORD: dev-pass
  MARIADB_USER: kanadbuser
  MARIADB_PASSWORD: dev-pass
  MARIADB_DATABASE: kanaliiga
  DB_PASSWORD: dev-pass
  DB_USER: kanadbuser
  REDIS_HOST: eggo-redis
  REDIS_PORT: 6379

.deploy-variables: &deploy-variables
  # DEV & PROD
  #THE MARIADB VARIABLES ARE SET IN CI/CD VARIABLES ON GITLAB
  DB_USER: $MARIADB_USER
  DB_PASSWORD: $MARIADB_PASSWORD
  DB_NAME: $MARIADB_DATABASE
  # If true, migrations container will wait for old kana data to exist in db
  KANA: $KANA
  PORTAINER_URL: $PORTAINER_URL
  PORTAINER_TOKEN: $PORTAINER_TOKEN
  # Add deployment version for traceability
  DEPLOYED_VERSION: $CI_COMMIT_SHA
  DEPLOYED_REF: $CI_COMMIT_REF_NAME

.prepare-pnpm:
  before_script:
    - npm install -g corepack --force
    - corepack enable
    - corepack prepare pnpm@11.16.0 --activate
    - pnpm config set store-dir $PNPM_STORE_PATH
    - pnpm config set registry http://172.17.0.1:4873
    - pnpm install --frozen-lockfile

# Sadly gitlab changes do not support with anchors or references to make these DRY
.frontend-changes: &frontend-changes
  changes:
    - "package.json"
    - "pnpm-*.yaml"
    - ".gitlab-ci.yml"
    - "packages/**/*"
    - "scripts/*portainer*.sh"
    - "apps/frontend/**/*"

.backend-changes: &backend-changes
  changes:
    - "package.json"
    - "pnpm-*.yaml"
    - ".gitlab-ci.yml"
    - "packages/**/*"
    - "scripts/*portainer*.sh"
    - "apps/backend/**/*"

.all-app-changes: &all-app-changes
  changes:
    - "package.json"
    - "turbo.json"
    - "pnpm-*.yaml"
    - ".gitlab-ci.yml"
    - "packages/**/*"
    - "scripts/*portainer*.sh"
    - "apps/{frontend,backend}/**/*"
    - "docker-compose.*.yml"

# These either cant be DRY because the rules are OR and not AND (the - & anchors do not work really well)
.main-frontend:
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "development"
      <<: *frontend-changes

.main-backend:
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "development"
      <<: *backend-changes

.main-all-app:
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      <<: *all-app-changes

.dev-all-app:
  rules:
    - if: $CI_COMMIT_BRANCH == "development"
      <<: *all-app-changes

.mr-frontend:
  rules:
    - if: $CI_MERGE_REQUEST_ID
      <<: *frontend-changes

.mr-backend:
  rules:
    - if: $CI_MERGE_REQUEST_ID
      <<: *backend-changes

.mr-all-app:
  rules:
    - if: $CI_MERGE_REQUEST_ID
      <<: *all-app-changes

# Define a base Docker build configuration without rules
.docker-build-base: &docker-build-base
  stage: build-docker
  image: docker:$DOCKER_IMAGE_TAG
  # Define global services for the entire pipeline
  services:
    - name: docker:$DOCKER_DIND_IMAGE_TAG
      alias: docker
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker buildx create --use --name mybuilder --driver docker-container
    - docker buildx inspect --bootstrap

# Common configuration for MR Docker builds
.common-docker-build: &common-docker-build
  <<: *docker-build-base
  rules:
    - if: $CI_MERGE_REQUEST_ID && $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - "apps/backend/Dockerfile*"
        - "apps/frontend/Dockerfile*"
        - "apps/backend/Dockerfile.migrations*"
    - if: $CI_COMMIT_BRANCH == "main"
      <<: *all-app-changes
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual

# Common configuration for main branch Docker builds
.common-docker-push: &common-docker-push
  <<: *docker-build-base
  # These jobs should only run on main branch

stages:
  - install
  - lint
  - security
  - test
  - build
  - test-e2e
  - build-docker
  # - post-build
  - on-demand-env
  - cleanup
  - deploy
  - pages

install:
  stage: install
  extends: [.mr-all-app]
  before_script:
    - npm install -g corepack --force
    - corepack enable
    - corepack prepare pnpm@11.16.0 --activate
    - pnpm config set store-dir $PNPM_STORE_PATH
    - pnpm config set registry http://172.17.0.1:4873 #172.17.0.1 aridivereci!
  script:
    - pnpm install --frozen-lockfile

typecheck:
  stage: lint
  extends: [.prepare-pnpm, .mr-all-app]
  script:
    - npx turbo typecheck

lint-all:
  stage: lint
  extends: [.prepare-pnpm, .mr-frontend, .mr-backend]
  script:
    - npx turbo run lint --continue

knip:
  stage: lint
  extends: [.prepare-pnpm, .mr-all-app]
  script:
    - pnpm --filter=@eggosystem/types build
    - pnpm --filter=@eggosystem/shared-msw build
    - pnpm knip

format:check:
  stage: lint
  extends: [.prepare-pnpm, .mr-all-app]
  script:
    - pnpm format:check
  allow_failure: false

audit:
  stage: security
  extends: [.prepare-pnpm, .mr-all-app]
  script:
    - pnpm audit --json > gl-dependency-scanning-report.json || true
    - apt update && apt install -y jq curl
    - ./scripts/audit.sh
    - |
      # Count vulnerabilities by severity
      if [ -f gl-dependency-scanning-report.json ]; then
        CRITICAL=$(cat gl-dependency-scanning-report.json | jq '[.advisories | to_entries[]?.value | select(.severity == "critical")] | length' 2>/dev/null || echo 0)
        HIGH=$(cat gl-dependency-scanning-report.json | jq '[.advisories | to_entries[]?.value | select(.severity == "high")] | length' 2>/dev/null || echo 0)
        MODERATE=$(cat gl-dependency-scanning-report.json | jq '[.advisories | to_entries[]?.value | select(.severity == "moderate")] | length' 2>/dev/null || echo 0)

        echo ""
        echo "╔══════════════════════════════════════════════════════════════╗"
        echo "║           NPM DEPENDENCY AUDIT RESULTS                       ║"
        echo "╠══════════════════════════════════════════════════════════════╣"
        echo "║  🔴 CRITICAL: $CRITICAL                                      "
        echo "║  🟠 HIGH:     $HIGH                                          "
        echo "║  🟡 MODERATE: $MODERATE                                      "
        echo "╚══════════════════════════════════════════════════════════════╝"
        echo ""

        # Print actual advisory details for HIGH + CRITICAL
        if [ "$CRITICAL" -gt 0 ] || [ "$HIGH" -gt 0 ]; then
          echo "Detailed HIGH + CRITICAL npm advisories:"
          jq -c '
            .advisories | to_entries[]?.value
            | select(.severity == "critical" or .severity == "high")
            | {
                severity: (.severity | ascii_upcase),
                id: (.id // "n/a"),
                title: (.title // "n/a"),
                url: (.url // "n/a"),
                recommendation: (.recommendation // .overview // "n/a")
              }
          ' gl-dependency-scanning-report.json || true
          echo ""
        fi

        # Warn on CRITICAL vulnerabilities but don't block pipeline
        if [ "$CRITICAL" -gt 0 ]; then
          echo "⚠️ CRITICAL npm vulnerabilities found!"
          echo "   Run 'pnpm audit' locally to see details and fix."
          echo "   Pipeline will continue but review recommended before merging."
        fi

        # Warn on HIGH vulnerabilities
        if [ "$HIGH" -gt 0 ]; then
          echo "⚠️ HIGH severity npm vulnerabilities found."
          echo "   Consider fixing these before merging."
        fi

        # Exit with warning status if critical or high vulnerabilities found
        # This makes GitLab show the job with a warning icon (yellow/orange)
        if [ "$CRITICAL" -gt 0 ] || [ "$HIGH" -gt 0 ]; then
          exit 1
        fi
      fi
  artifacts:
    expire_in: 7 days
    reports:
      dependency_scanning: gl-dependency-scanning.json
    paths:
      - gl-dependency-scanning.json
      - gl-dependency-scanning-report.json
  allow_failure: true # Allow pipeline to continue, but mark as warning

secrets_scan:
  stage: security
  image: python:3.14
  extends: [.mr-all-app]
  script:
    - pip install trufflehog
    - trufflehog --regex --entropy=False .

test:backend:
  stage: test
  extends: [.mr-backend]
  services:
    - name: mariadb:$MARIADB_TAG
      alias: eggo-devdb
    # - name: redis:8-alpine
    #   alias: eggo-redis
  variables:
    <<: *overwrite-variables
  parallel: 4
  before_script:
    - npm install -g corepack --force
    - corepack enable
    - corepack prepare pnpm@11.16.0 --activate
    - pnpm config set registry http://172.17.0.1:4873
    - pnpm install --frozen-lockfile
    - npx turbo run build --filter='@eggosystem/shared-msw'
    - export $(grep -v '^#' .env.development | xargs)
    - pnpm --filter=backend seed
    - pnpm migrate
  script:
    - cd apps/backend && NODE_ENV=test npx jest --shard=$CI_NODE_INDEX/$CI_NODE_TOTAL --coverage --ci --detectOpenHandles && mv coverage/coverage-final.json coverage/coverage-final-$CI_NODE_INDEX.json
  coverage: '/Statements\s+:\s+([\d.]+)%/'
  artifacts:
    expire_in: 7 days
    when: always
    reports:
      junit:
        - apps/backend/test-results/junit/results.xml
      coverage_report:
        coverage_format: cobertura
        path: apps/backend/coverage/cobertura-coverage.xml
    paths:
      - apps/backend/test-results/junit/results.xml
      - apps/backend/coverage/cobertura-coverage.xml
      - apps/backend/coverage/coverage-final-*.json

# Merge coverage from all shards and enforce thresholds
test:backend:coverage-merge:
  stage: test
  extends: [.prepare-pnpm, .mr-backend]
  needs:
    - job: test:backend
      artifacts: true
  script:
    - cd apps/backend
    # Install nyc for coverage merging
    - npx nyc merge coverage coverage/.nyc_output/merged.json
    - npx nyc report --reporter=text --reporter=text-summary --temp-dir=coverage/.nyc_output
    # Check coverage thresholds
    - |
      npx nyc check-coverage \
        --temp-dir=coverage/.nyc_output \
        --branches 65 \
        --functions 50 \
        --lines 60 \
        --statements 60
  coverage: '/Statements\s+:\s+([\d.]+)%/'
  allow_failure: false

test:frontend:
  stage: test
  extends: [.mr-frontend]
  before_script:
    - npm install -g corepack --force
    - corepack enable
    - corepack prepare pnpm@11.16.0 --activate
    - pnpm config set registry http://172.17.0.1:4873
    - pnpm install --frozen-lockfile
    - pnpm --filter=@eggosystem/types build
  script:
    - pnpm --filter=frontend test --runInBand
  coverage: '/Statements\s+:\s+([\d.]+)%/'
  artifacts:
    expire_in: 7 days
    when: always
    reports:
      junit:
        - apps/frontend/test-results/junit/results.xml
      coverage_report:
        coverage_format: cobertura
        path: apps/frontend/coverage/cobertura-coverage.xml
    paths:
      - apps/frontend/test-results/junit/results.xml
      - apps/frontend/coverage/cobertura-coverage.xml

build:types:
  stage: build
  extends: [.prepare-pnpm, .mr-all-app]
  script:
    - npx turbo run build --filter='@eggosystem/types'
  artifacts:
    expire_in: 7 days
    paths:
      - packages/types/dist/

build:shared-msw:
  stage: build
  extends: [.prepare-pnpm, .mr-all-app]
  script:
    - npx turbo run build --filter='@eggosystem/shared-msw'
  artifacts:
    expire_in: 7 days
    paths:
      - packages/shared-msw/dist/

build:frontend:
  stage: build
  extends: [.prepare-pnpm, .mr-all-app]
  script:
    - npx turbo run build --filter='!backend'
  artifacts:
    expire_in: 7 days
    paths:
      - apps/frontend/.next/

build:backend:
  stage: build
  extends: [.prepare-pnpm, .mr-all-app]
  script:
    - npx turbo run build --filter='!frontend'
  artifacts:
    expire_in: 7 days
    paths:
      - apps/backend/dist/

test-e2e:frontend:
  image: mcr.microsoft.com/playwright:v1.60.0-jammy
  stage: test-e2e
  dependencies:
    - build:backend
    - build:frontend
    - build:types
    - build:shared-msw
  services:
    - name: mariadb:$MARIADB_TAG
      alias: eggo-devdb
    - name: redis:8-alpine
      alias: eggo-redis
  extends: [.mr-all-app]
  variables:
    <<: *overwrite-variables
    MARIADB_MAX_ALLOWED_PACKET: 128M
    MARIADB_INNODB_LOG_FILE_SIZE: 64M
    PRIVACY_POLICY_VERSION: "1"
    FRONTEND_URL: "http://localhost:3000"
  before_script:
    - apt-get update && apt-get install -y openssl
    - | # Generate private and public access tokens
      openssl genpkey -algorithm RSA -out apps/backend/private_access_token.pem && 
      openssl rsa -pubout -in apps/backend/private_access_token.pem -out apps/backend/public_access_token.pem &&
      openssl genpkey -algorithm RSA -out apps/backend/private_refresh_token.pem &&
      openssl rsa -pubout -in apps/backend/private_refresh_token.pem -out apps/backend/public_refresh_token.pem
    - npm install -g corepack --force
    - corepack enable
    - corepack prepare pnpm@11.16.0 --activate
    - export $(grep -v '^#' .env.development | xargs)
    # Ensure PRIVACY_POLICY_VERSION is set for E2E tests
    - export PRIVACY_POLICY_VERSION=1
    - pnpm config set registry http://172.17.0.1:4873
    - pnpm install --frozen-lockfile
    - NODE_ENV=e2e pnpm --filter=backend start &
    # - pnpm --filter=backend start &
  script:
    - unset NODE_ENV
    - pnpm test:e2e
  artifacts:
    expire_in: 7 days
    when: always
    paths:
      - apps/frontend/playwright-report/
      - apps/frontend/test-results/
    reports:
      junit: apps/frontend/test-results/junit-report.xml

# Backend job
build-dockerfile:backend:
  <<: *common-docker-build
  variables:
    IMAGE_NAME: eggo-backend
    DOCKERFILE_DEV: apps/backend/Dockerfile.dev
    DOCKERFILE: apps/backend/Dockerfile
    DOCKERFILE_MIGRATIONS: apps/backend/Dockerfile.migrations.dev
    TRIVY_NO_PROGRESS: "true"
    TRIVY_CACHE_DIR: ".trivycache/"
    REGISTRY: $CI_REGISTRY/kanaliiga_public/kanahub/eggosystem
    CACHE_TAG: ${CI_COMMIT_REF_SLUG}
  parallel:
    matrix:
      - BUILD_TYPE: [dev, production, migrations]
  script:
    - |
      if [ "$BUILD_TYPE" == "dev" ]; then
        docker buildx build \
          --cache-from type=registry,ref=$REGISTRY/eggo-backend:dev-cache \
          --build-arg CI=true \
          -t eggo-backend:dev \
          -f $DOCKERFILE_DEV .
      elif [ "$BUILD_TYPE" == "production" ]; then
        docker buildx build \
          --cache-from type=registry,ref=$REGISTRY/eggo-backend:latest \
          --cache-from type=registry,ref=$REGISTRY/eggo-backend:$CI_COMMIT_SHA \
          --cache-from type=registry,ref=$REGISTRY/eggo-backend:cache \
          --build-arg CI=true \
          -t eggo-backend:$CI_COMMIT_SHA \
          -f $DOCKERFILE .
      elif [ "$BUILD_TYPE" == "migrations" ]; then
        docker buildx build \
          --cache-from type=registry,ref=$REGISTRY/eggo-migrations:dev \
          --cache-from type=registry,ref=$REGISTRY/eggo-migrations:dev-cache \
          --build-arg CI=true \
          -t eggo-migrations:dev \
          -f $DOCKERFILE_MIGRATIONS .
      fi

# Frontend job
build-dockerfile:frontend:
  <<: *common-docker-build
  variables:
    IMAGE_NAME: eggo-frontend
    DOCKERFILE_DEV: apps/frontend/Dockerfile.dev
    DOCKERFILE: apps/frontend/Dockerfile
    TRIVY_NO_PROGRESS: "true"
    TRIVY_CACHE_DIR: ".trivycache/"
    ENV_ID: mr-${CI_MERGE_REQUEST_IID}
    REGISTRY: $CI_REGISTRY/kanaliiga_public/kanahub/eggosystem
    CACHE_TAG: ${CI_COMMIT_REF_SLUG}
  parallel:
    matrix:
      - BUILD_TYPE: [dev, production]
  script:
    - |
      if [ "$BUILD_TYPE" == "dev" ] && [ "$CI_COMMIT_BRANCH" == "development" ]; then
        docker buildx build \
          --cache-from type=registry,ref=$REGISTRY/eggo-frontend:dev-cache \
          --cache-to type=registry,ref=$REGISTRY/eggo-frontend:dev-cache,mode=max,compression=zstd \
          --build-arg NEXT_PUBLIC_VIEWER_API_URL=https://$CS2DDEV_PUBLIC_URL \
          --build-arg NEXT_PUBLIC_API_URL=https://$HUBDEV_PUBLIC_URL \
          --build-arg NEXT_PUBLIC_CLIENT_API_URL=https://$HUBDEV_PUBLIC_URL \
          --build-arg NEXT_PUBLIC_BASE_URL=https://$HUBDEV_PUBLIC_URL \
          --build-arg NEXT_PUBLIC_GIT_SHA=$CI_COMMIT_SHA \
          --build-arg NEXT_PUBLIC_GITLAB_URL=$CI_PROJECT_URL/-/commit/$CI_COMMIT_SHA \
          --build-arg CI=true \
          --push \
          -t $REGISTRY/eggo-frontend:dev \
          -f apps/frontend/Dockerfile.dev .
      elif [ "$BUILD_TYPE" == "production" ] && [ "$CI_COMMIT_BRANCH" == "main" ]; then
        docker buildx build \
          --cache-from type=registry,ref=$REGISTRY/eggo-frontend:latest \
          --cache-from type=registry,ref=$REGISTRY/eggo-frontend:$CI_COMMIT_SHA \
          --cache-from type=registry,ref=$REGISTRY/eggo-frontend:cache \
          --cache-from type=registry,ref=$REGISTRY/eggo-frontend:stage-cache \
          --cache-from type=registry,ref=$REGISTRY/eggo-frontend:$ENV_ID-cache \
          --cache-to type=registry,ref=$REGISTRY/eggo-frontend:$ENV_ID-cache,mode=max,compression=zstd \
          --build-arg NEXT_PUBLIC_VIEWER_API_URL=https://$CS2DDEV_PUBLIC_URL \
          --build-arg NEXT_PUBLIC_API_URL=https://$HUBDEV_PUBLIC_URL/$ENV_ID \
          --build-arg NEXT_PUBLIC_CLIENT_API_URL=https://$HUBDEV_PUBLIC_URL/$ENV_ID \
          --build-arg NEXT_PUBLIC_BASE_PATH=/$ENV_ID \
          --build-arg NEXT_PUBLIC_BASE_URL=https://$HUBDEV_PUBLIC_URL \
          --build-arg NEXT_PUBLIC_GIT_SHA=$CI_COMMIT_SHA \
          --build-arg NEXT_PUBLIC_GITLAB_URL=$CI_PROJECT_URL/-/commit/$CI_COMMIT_SHA \
          --build-arg CI=true \
          -t eggo-frontend \
          -f $DOCKERFILE .
      fi

push-dockerfile:backend:
  <<: *common-docker-push
  stage: build-docker
  extends: [.main-backend]
  variables:
    REGISTRY: $CI_REGISTRY/kanaliiga_public/kanahub/eggosystem
  parallel:
    matrix:
      - BUILD_TYPE: [dev, production] # No stage, because we use latest or GIT_COMMIT_SHA
  script:
    - |
      if [ "$BUILD_TYPE" == "dev" ] && [ "$CI_COMMIT_BRANCH" == "development" ]; then
        docker buildx build \
          --cache-from type=registry,ref=$REGISTRY/eggo-backend:dev-cache \
          --cache-from type=registry,ref=$REGISTRY/eggo-backend:$CI_COMMIT_SHA \
          --cache-to type=registry,ref=$REGISTRY/eggo-backend:dev-cache,mode=max,compression=zstd \
          --build-arg CI=true \
          --push \
          -t $REGISTRY/eggo-backend:dev \
          -f apps/backend/Dockerfile.dev .
      elif [ "$BUILD_TYPE" == "production" ] && [ "$CI_COMMIT_BRANCH" == "main" ]; then
        docker buildx build \
          --cache-from type=registry,ref=$REGISTRY/eggo-backend:latest \
          --cache-from type=registry,ref=$REGISTRY/eggo-backend:cache \
          --cache-from type=registry,ref=$REGISTRY/eggo-backend:$CI_COMMIT_SHA \
          --cache-to type=registry,ref=$REGISTRY/eggo-backend:cache,mode=max,compression=zstd \
          --build-arg CI=true \
          --push \
          -t $REGISTRY/eggo-backend:$CI_COMMIT_SHA \
          -t $REGISTRY/eggo-backend:latest \
          -f apps/backend/Dockerfile .
      fi

push-dockerfile:migrations:
  <<: *common-docker-push
  stage: build-docker
  extends: [.main-backend]
  variables:
    REGISTRY: $CI_REGISTRY/kanaliiga_public/kanahub/eggosystem
  script:
    - |
      if [ "$CI_COMMIT_BRANCH" == "development" ]; then
          docker buildx build \
            --cache-from type=registry,ref=$REGISTRY/eggo-migrations:dev \
            --cache-from type=registry,ref=$REGISTRY/eggo-migrations:dev-cache \
            --cache-to type=registry,ref=$REGISTRY/eggo-migrations:dev-cache,mode=max,compression=zstd \
            --build-arg CI=true \
            --push \
            -t $REGISTRY/eggo-migrations:dev \
            -f apps/backend/Dockerfile.migrations.dev .
        elif [ "$CI_COMMIT_BRANCH" == "main" ]; then
          docker buildx build \
            --cache-from type=registry,ref=$REGISTRY/eggo-migrations:latest \
            --cache-from type=registry,ref=$REGISTRY/eggo-migrations:cache \
            --cache-from type=registry,ref=$REGISTRY/eggo-migrations:$CI_COMMIT_SHA \
            --cache-to type=registry,ref=$REGISTRY/eggo-migrations:cache,mode=max,compression=zstd \
            --build-arg CI=true \
            --push \
            -t $REGISTRY/eggo-migrations:$CI_COMMIT_SHA \
            -t $REGISTRY/eggo-migrations:latest \
            -t $REGISTRY/eggo-migrations:staging \
            -f apps/backend/Dockerfile.migrations.dev .
      fi

push-dockerfile:frontend:
  <<: *common-docker-push
  stage: build-docker
  extends: [.main-frontend]
  variables:
    REGISTRY: $CI_REGISTRY/kanaliiga_public/kanahub/eggosystem
  parallel:
    matrix:
      - BUILD_TYPE: [dev, stage, latest]
  script:
    - |
      if [ "$BUILD_TYPE" == "dev" ] && [ "$CI_COMMIT_BRANCH" == "development" ]; then
        docker buildx build \
          --cache-from type=registry,ref=$REGISTRY/eggo-frontend:dev-cache \
          --cache-to type=registry,ref=$REGISTRY/eggo-frontend:dev-cache,mode=max,compression=zstd \
          --build-arg NEXT_PUBLIC_VIEWER_API_URL=https://$CS2DDEV_PUBLIC_URL \
          --build-arg NEXT_PUBLIC_API_URL=https://$HUBDEV_PUBLIC_URL \
          --build-arg NEXT_PUBLIC_CLIENT_API_URL=https://$HUBDEV_PUBLIC_URL \
          --build-arg NEXT_PUBLIC_BASE_URL=https://$HUBDEV_PUBLIC_URL \
          --build-arg NEXT_PUBLIC_IMAGE_SERVICE_URL=https://$IMG_DEV_PUBLIC_URL \
          --build-arg NEXT_PUBLIC_GIT_SHA=$CI_COMMIT_SHA \
          --build-arg NEXT_PUBLIC_GITLAB_URL=$CI_PROJECT_URL/-/commit/$CI_COMMIT_SHA \
          --build-arg CI=true \
          --push \
          -t $REGISTRY/eggo-frontend:dev \
          -f apps/frontend/Dockerfile.dev .
      elif [ "$BUILD_TYPE" == "stage" ] && [ "$CI_COMMIT_BRANCH" == "main" ]; then
        # Build a stage-specific image with stage URLs
        docker buildx build \
          --cache-from type=registry,ref=$REGISTRY/eggo-frontend:stage \
          --cache-from type=registry,ref=$REGISTRY/eggo-frontend:stage-cache \
          --cache-from type=registry,ref=$REGISTRY/eggo-frontend:$CI_COMMIT_SHA-stage \
          --cache-to type=registry,ref=$REGISTRY/eggo-frontend:stage-cache,mode=max,compression=zstd \
          --build-arg NEXT_PUBLIC_VIEWER_API_URL=https://$CS2DSTAGE_PUBLIC_URL \
          --build-arg NEXT_PUBLIC_API_URL=https://$HUBSTAGE_PUBLIC_URL \
          --build-arg NEXT_PUBLIC_CLIENT_API_URL=https://$HUBSTAGE_PUBLIC_URL \
          --build-arg NEXT_PUBLIC_BASE_URL=https://$HUBSTAGE_PUBLIC_URL \
          --build-arg NEXT_PUBLIC_IMAGE_SERVICE_URL=https://$IMG_STAGE_PUBLIC_URL \
          --build-arg NEXT_PUBLIC_GIT_SHA=$CI_COMMIT_SHA \
          --build-arg NEXT_PUBLIC_GITLAB_URL=$CI_PROJECT_URL/-/commit/$CI_COMMIT_SHA \
          --build-arg CI=true \
          --push \
          -t $REGISTRY/eggo-frontend:$CI_COMMIT_SHA-stage \
          -t $REGISTRY/eggo-frontend:stage \
          -f apps/frontend/Dockerfile .
      elif [ "$BUILD_TYPE" == "latest" ] && [ "$CI_COMMIT_BRANCH" == "main" ]; then
        # Build a production image with production URLs
        docker buildx build \
          --cache-from type=registry,ref=$REGISTRY/eggo-frontend:latest \
          --cache-from type=registry,ref=$REGISTRY/eggo-frontend:cache \
          --cache-from type=registry,ref=$REGISTRY/eggo-frontend:$CI_COMMIT_SHA \
          --cache-to type=registry,ref=$REGISTRY/eggo-frontend:cache,mode=max,compression=zstd \
          --build-arg NEXT_PUBLIC_VIEWER_API_URL=https://$CS2D_PUBLIC_URL \
          --build-arg NEXT_PUBLIC_API_URL=https://$HUB_PUBLIC_URL \
          --build-arg NEXT_PUBLIC_CLIENT_API_URL=https://$HUB_PUBLIC_URL \
          --build-arg NEXT_PUBLIC_BASE_URL=https://$HUB_PUBLIC_URL \
          --build-arg NEXT_PUBLIC_IMAGE_SERVICE_URL=https://$IMG_PROD_PUBLIC_URL \
          --build-arg NEXT_PUBLIC_GIT_SHA=$CI_COMMIT_SHA \
          --build-arg NEXT_PUBLIC_GITLAB_URL=$CI_PROJECT_URL/-/commit/$CI_COMMIT_SHA \
          --build-arg CI=true \
          --push \
          -t $REGISTRY/eggo-frontend:$CI_COMMIT_SHA \
          -t $REGISTRY/eggo-frontend:latest \
          -f apps/frontend/Dockerfile .
      fi

# Trivy container scanning is handled in a separate scheduled pipeline
# See: .gitlab/trivy-scan.gitlab-ci.yml

deploy-prod:
  image: alpine:latest
  stage: deploy
  extends: [.main-all-app]
  resource_group: production
  when: manual
  needs:
    - deploy-stage
  environment:
    name: production
    url: https://${HUB_PUBLIC_URL}
  variables:
    <<: *deploy-variables
    BACKEND_VERSION: $CI_COMMIT_SHA
    FRONTEND_VERSION: $CI_COMMIT_SHA
    MIGRATIONS_VERSION: $CI_COMMIT_SHA
  before_script:
    - "which ssh-agent || ( apk update -q && apk add openssh-client gettext rsync -q )"
    - eval $(ssh-agent -s)
    - echo "$HUB_PROD_SSH" | base64 -d | tr -d '\r' | ssh-add - > /dev/null
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan $HUB_PROD_IP >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - export PHPMYADMIN_AUTH=$(echo $PHPMYADMIN_AUTH_BASE64 | base64 -d)
    - envsubst < docker-compose.prod.yml > docker-compose.prod.subst.yml
    - envsubst < conf/mariadb/maxscale.cnf > conf/mariadb/maxscale.subst.yml
    - rsync -v ./conf/mariadb/maxscale.subst.yml ubuntu@$HUB_PROD_IP:~/docker/eggosystem/maxscale.cnf
    - rsync -v ./docker-compose.prod.subst.yml ubuntu@$HUB_PROD_IP:~/docker/eggosystem/docker-compose.yml
    - rsync -v ./conf/mariadb/my.cnf ubuntu@$HUB_PROD_IP:~/docker/eggosystem/my.cnf
    - ssh ubuntu@$HUB_PROD_IP "docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY"
    - ssh ubuntu@$HUB_PROD_IP "docker compose -f ~/docker/eggosystem/docker-compose.yml pull"
    - ssh ubuntu@$HUB_PROD_IP "docker compose -f ~/docker/eggosystem/docker-compose.yml up -d"

deploy-stage:
  image: alpine:latest
  stage: deploy
  extends: [.main-all-app]
  resource_group: stage
  environment:
    name: stage
    url: https://${HUBSTAGE_PUBLIC_URL}
  variables:
    <<: *deploy-variables
    ENV_ID: stage
    BACKEND_VERSION: $CI_COMMIT_SHA
    FRONTEND_VERSION: $CI_COMMIT_SHA-stage # Use the stage-specific frontend build
    MIGRATIONS_VERSION: $CI_COMMIT_SHA
  before_script:
    - "which ssh-agent || ( apk update -q && apk add openssh-client gettext rsync -q )"
    - eval $(ssh-agent -s)
    - echo "$HUB_PROD_SSH" | base64 -d | tr -d '\r' | ssh-add - > /dev/null
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan $HUB_STAGE_IP >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - export PHPMYADMIN_AUTH=$(echo $PHPMYADMIN_AUTH_BASE64 | base64 -d)
    - envsubst < docker-compose.stage.yml > docker-compose.stage.subst.yml
    - rsync -v ./docker-compose.stage.subst.yml ubuntu@$HUB_STAGE_IP:~/docker/eggosystem-staging/docker-compose.yml
    - rsync -v ./conf/mariadb/my.cnf ubuntu@$HUB_STAGE_IP:~/docker/eggosystem-staging/my.cnf
    - ssh ubuntu@$HUB_STAGE_IP "docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY"
    - ssh ubuntu@$HUB_STAGE_IP "docker compose -f ~/docker/eggosystem-staging/docker-compose.yml pull"
    - ssh ubuntu@$HUB_STAGE_IP "docker compose -f ~/docker/eggosystem-staging/docker-compose.yml up -d"
    - exitcode=$(ssh ubuntu@$HUB_STAGE_IP "docker wait eggosystem-staging-eggo-migrations-1")
    - |
      if [ "$exitcode" != "0" ]; then
        echo "Migration container exited with code $exitcode. Pipeline failed."
        exit 1
      fi
    - |
      echo ""
      echo "=============================================="
      echo "🚀 DEPLOYMENT SUCCESSFUL!"
      echo "=============================================="
      echo "📱 Frontend: https://${HUBSTAGE_PUBLIC_URL}"
      echo "🔌 API: https://${HUBSTAGE_PUBLIC_URL}/api/v1"
      echo "🗄️ phpMyAdmin: https://${HUBSTAGE_PUBLIC_URL}/mysadmin/"
      echo "=============================================="

deploy-dev:
