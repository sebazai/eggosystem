image: node:22-slim

variables:
  # Docker configuration
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: overlay2
  # Other global variables
  PNPM_HOME: $CI_PROJECT_DIR/.pnpm-store
  TRIVY_VERSION: "0.59.1" # Set the Trivy version here
  TRIVY_SEVERITY: "HIGH,CRITICAL,MEDIUM"
  PNPM_STORE_PATH: .pnpm-store
  TURBO_TOKEN: $TURBO_TOKEN
  TURBO_TEAM: $TURBO_TEAM
  TRANSFER_METER_FREQUENCY: "10s"
  CACHE_COMPRESSION_LEVEL: "fastest"
  FF_USE_FASTZIP: 1

# Define on-demand environment variables
.overwrite-variables: &overwrite-variables
  ENV_ID: mr-${CI_MERGE_REQUEST_IID}
  MARIADB_ROOT_PASSWORD: dev-pass
  MARIADB_USER: kanadbuser
  MARIADB_PASSWORD: dev-pass
  MARIADB_DATABASE: kanaliiga
  DB_PASSWORD: dev-pass
  DB_USER: kanadbuser
  REDIS_HOST: eggo-redis
  REDIS_PORT: 6379

.deploy-variables: &deploy-variables
  # DEV & PROD
  #THE MARIADB VARIABLES ARE SET IN CI/CD VARIABLES ON GITLAB
  DB_USER: $MARIADB_USER
  DB_PASSWORD: $MARIADB_PASSWORD
  DB_NAME: $MARIADB_DATABASE
  # If true, migrations container will wait for old kana data to exist in db
  KANA: $KANA
  PORTAINER_URL: $PORTAINER_URL
  PORTAINER_TOKEN: $PORTAINER_TOKEN

.prepare-pnpm:
  before_script:
    - corepack enable
    - corepack prepare pnpm@10.8.1 --activate
    - pnpm config set store-dir $PNPM_STORE_PATH
    - pnpm config set registry http://172.17.0.1:4873
    - pnpm install --frozen-lockfile

# Sadly gitlab changes do not support with anchors or references to make these DRY
.frontend-changes: &frontend-changes
  changes:
    - "package.json"
    - "pnpm-*.yaml"
    - ".gitlab-ci.yml"
    - "packages/**/*"
    - "scripts/*portainer*.sh"
    - "apps/frontend/**/*"

.backend-changes: &backend-changes
  changes:
    - "package.json"
    - "pnpm-*.yaml"
    - ".gitlab-ci.yml"
    - "packages/**/*"
    - "scripts/*portainer*.sh"
    - "apps/backend/**/*"

.all-app-changes: &all-app-changes
  changes:
    - "package.json"
    - "turbo.json"
    - "pnpm-*.yaml"
    - ".gitlab-ci.yml"
    - "packages/**/*"
    - "scripts/*portainer*.sh"
    - "apps/{frontend,backend}/**/*"
    - "docker-compose.*.yml"

# These either cant be DRY because the rules are OR and not AND (the - & anchors do not work really well)
.main-frontend:
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      <<: *frontend-changes

.main-backend:
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      <<: *backend-changes

.main-all-app:
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      <<: *all-app-changes

.mr-frontend:
  rules:
    - if: $CI_MERGE_REQUEST_ID
      <<: *frontend-changes

.mr-backend:
  rules:
    - if: $CI_MERGE_REQUEST_ID
      <<: *backend-changes

.mr-all-app:
  rules:
    - if: $CI_MERGE_REQUEST_ID
      <<: *all-app-changes

# Define a base Docker build configuration without rules
.docker-build-base: &docker-build-base
  stage: build-docker
  image: docker:28.1.1-alpine3.21
  # Define global services for the entire pipeline
  services:
    - name: docker:28.1.1-dind-alpine3.21
      alias: docker
  needs: []
  dependencies: []
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker buildx create --use --name mybuilder --driver docker-container
    - docker buildx inspect --bootstrap

# Common configuration for MR Docker builds
.common-docker-build: &common-docker-build
  <<: *docker-build-base
  rules:
    - if: $CI_MERGE_REQUEST_ID && $CI_PIPELINE_SOURCE == "merge_request_event"
      <<: *all-app-changes
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual

# Common configuration for main branch Docker builds
.common-docker-push: &common-docker-push
  <<: *docker-build-base
  # These jobs should only run on main branch

stages:
  - install
  - lint
  - security
  - test
  - build
  - test-e2e
  - build-docker
  # - post-build
  - on-demand-env
  - cleanup
  - deploy

install:
  stage: install
  extends: [.mr-all-app]
  before_script:
    - corepack enable
    - corepack prepare pnpm@10.8.1 --activate
    - pnpm config set store-dir $PNPM_STORE_PATH
    - pnpm config set registry http://172.17.0.1:4873 #172.17.0.1 aridivereci!
  script:
    - pnpm install --frozen-lockfile

check-types:
  stage: lint
  extends: [.prepare-pnpm, .mr-all-app]
  script:
    - npx turbo check-types --cache=remote:rw

lint-all:
  stage: lint
  extends: [.prepare-pnpm, .mr-frontend, .mr-backend]
  script:
    - npx turbo run lint --continue --cache=remote:rw

audit:
  stage: security
  extends: [.prepare-pnpm, .mr-all-app]
  script:
    - pnpm audit --json > gl-dependency-scanning-report.json || true
    - apt update && apt install -y jq
    - ./scripts/audit.sh
  artifacts:
    reports:
      dependency_scanning: gl-dependency-scanning.json
    paths:
      - gl-dependency-scanning.json

secrets_scan:
  stage: security
  image: python:3.13
  extends: [.mr-all-app]
  script:
    - pip install trufflehog
    - trufflehog --regex --entropy=False .

test:backend:
  stage: test
  extends: [.mr-backend]
  services:
    - name: bitnami/mariadb:11.4.2
      alias: eggo-devdb
    # - name: redis:8-alpine
    #   alias: eggo-redis
  variables:
    <<: *overwrite-variables
  before_script:
    - corepack enable
    - corepack prepare pnpm@10.8.1 --activate
    - pnpm config set registry http://172.17.0.1:4873
    - pnpm install --frozen-lockfile
    - export $(grep -v '^#' .env.development | xargs)
    - pnpm --filter=backend seed
  script:
    - npx turbo run test --filter=backend --cache=remote:rw
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
  artifacts:
    when: always
    reports:
      junit:
        - apps/backend/test-results/junit/results.xml
      coverage_report:
        coverage_format: cobertura
        path: apps/backend/coverage/cobertura-coverage.xml
    paths:
      - apps/backend/test-results/junit/results.xml
      - apps/backend/coverage/cobertura-coverage.xml

test:frontend:
  image: mcr.microsoft.com/playwright:v1.52.0-jammy
  stage: test
  extends: [.mr-frontend]
  variables:
    <<: *overwrite-variables
  before_script:
    - corepack enable
    - corepack prepare pnpm@10.8.1 --activate
    - export $(grep -v '^#' .env.development | xargs)
    - pnpm config set registry http://172.17.0.1:4873
    - pnpm install --frozen-lockfile
    - pnpm --filter="@eggosystem/types" build
  script:
    - unset NODE_ENV
    - pnpm --filter=frontend test:integration
  artifacts:
    when: always
    paths:
      - apps/frontend/playwright-report/
      - apps/frontend/test-results/
    reports:
      junit: apps/frontend/test-results/junit-report.xml
build:types:
  stage: build
  extends: [.prepare-pnpm, .mr-all-app]
  script:
    - npx turbo run build --filter='@eggosystem/types'

build:frontend:
  stage: build
  extends: [.prepare-pnpm, .mr-frontend]
  script:
    - npx turbo run build --filter='!backend' --cache=remote:rw

build:backend:
  stage: build
  extends: [.prepare-pnpm, .mr-backend]
  script:
    - npx turbo run build --filter='!frontend' --cache=remote:rw

test-e2e:frontend:
  image: mcr.microsoft.com/playwright:v1.52.0-jammy
  stage: test-e2e
  services:
    - name: bitnami/mariadb:11.4.2
      alias: eggo-devdb
    - name: redis:8-alpine
      alias: eggo-redis
  extends: [.mr-all-app]
  variables:
    <<: *overwrite-variables
    MARIADB_MAX_ALLOWED_PACKET: 128M
    MARIADB_INNODB_LOG_FILE_SIZE: 64M
  before_script:
    - apt-get update && apt-get install -y openssl
    - | # Generate private and public access tokens
      openssl genpkey -algorithm RSA -out apps/backend/private_access_token.pem && 
      openssl rsa -pubout -in apps/backend/private_access_token.pem -out apps/backend/public_access_token.pem &&
      openssl genpkey -algorithm RSA -out apps/backend/private_refresh_token.pem &&
      openssl rsa -pubout -in apps/backend/private_refresh_token.pem -out apps/backend/public_refresh_token.pem
    - corepack enable
    - corepack prepare pnpm@10.8.1 --activate
    - export $(grep -v '^#' .env.development | xargs)
    - pnpm config set registry http://172.17.0.1:4873
    - pnpm install --frozen-lockfile
    - pnpm --filter=backend seed # Run regular seeding
    - pnpm --filter=backend seed:e2e # Run seeding for test environment
    - pnpm --filter=backend start &
  script:
    - unset NODE_ENV
    - pnpm --filter=frontend test:e2e
  artifacts:
    when: always
    paths:
      - apps/frontend/playwright-report/
      - apps/frontend/test-results/
    reports:
      junit: apps/frontend/test-results/junit-report.xml

# Backend job
build-dockerfile:backend:
  <<: *common-docker-build
  variables:
    IMAGE_NAME: eggo-backend
    DOCKERFILE_DEV: apps/backend/Dockerfile.dev
    DOCKERFILE: apps/backend/Dockerfile
    DOCKERFILE_MIGRATIONS: apps/backend/Dockerfile.migrations.dev
    TRIVY_NO_PROGRESS: "true"
    TRIVY_CACHE_DIR: ".trivycache/"
    REGISTRY: $CI_REGISTRY/kanaliiga_public/kanahub/eggosystem
    CACHE_TAG: ${CI_COMMIT_REF_SLUG}
  parallel:
    matrix:
      - BUILD_TYPE: [dev, production, migrations]
  script:
    - |
      if [ "$BUILD_TYPE" == "dev" ]; then
        docker buildx build \
          --cache-from type=registry,ref=$REGISTRY/eggo-backend:dev-cache \
          --build-arg CI=true \
          -t eggo-backend:dev \
          -f $DOCKERFILE_DEV .
      elif [ "$BUILD_TYPE" == "production" ]; then
        docker buildx build \
          --cache-from type=registry,ref=$REGISTRY/eggo-backend:latest \
          --cache-from type=registry,ref=$REGISTRY/eggo-backend:cache \
          --build-arg CI=true \
          -t eggo-backend:latest \
          -f $DOCKERFILE .
      elif [ "$BUILD_TYPE" == "migrations" ]; then
        docker buildx build \
          --cache-from type=registry,ref=$REGISTRY/eggo-migrations:dev \
          --cache-from type=registry,ref=$REGISTRY/eggo-migrations:dev-cache \
          --build-arg CI=true \
          -t eggo-migrations:dev \
          -f $DOCKERFILE_MIGRATIONS .
      fi

# Frontend job
build-dockerfile:frontend:
  <<: *common-docker-build
  variables:
    IMAGE_NAME: eggo-frontend
    DOCKERFILE_DEV: apps/frontend/Dockerfile.dev
    DOCKERFILE: apps/frontend/Dockerfile
    TRIVY_NO_PROGRESS: "true"
    TRIVY_CACHE_DIR: ".trivycache/"
    ENV_ID: mr-${CI_MERGE_REQUEST_IID}
    REGISTRY: $CI_REGISTRY/kanaliiga_public/kanahub/eggosystem
    CACHE_TAG: ${CI_COMMIT_REF_SLUG}
  parallel:
    matrix:
      - BUILD_TYPE: [dev, production]
  script:
    - |
      if [ "$BUILD_TYPE" == "dev" ]; then
        docker buildx build \
          --cache-from type=registry,ref=$REGISTRY/eggo-frontend:dev-cache \
          --build-arg CI=true \
          -t $REGISTRY/eggo-frontend:cache \
          -f $DOCKERFILE_DEV .
      elif [ "$BUILD_TYPE" == "production" ]; then
        docker buildx build \
          --cache-from type=registry,ref=$REGISTRY/eggo-frontend:latest \
          --cache-from type=registry,ref=$REGISTRY/eggo-frontend:cache \
          --cache-from type=registry,ref=$REGISTRY/eggo-frontend:staging-cache \
          --cache-from type=registry,ref=$REGISTRY/eggo-frontend:$ENV_ID-cache \
          --cache-to type=registry,ref=$REGISTRY/eggo-frontend:$ENV_ID-cache,mode=max,compression=zstd \
          --build-arg NEXT_PUBLIC_API_URL=https://$HUBDEV_PUBLIC_URL/$ENV_ID \
          --build-arg NEXT_PUBLIC_CLIENT_API_URL=https://$HUBDEV_PUBLIC_URL/$ENV_ID \
          --build-arg NEXT_PUBLIC_BASE_PATH=/$ENV_ID \
          --build-arg NEXT_PUBLIC_BASE_URL=https://$HUBDEV_PUBLIC_URL \
          --build-arg CI=true \
          -t eggo-frontend \
          -f $DOCKERFILE .
      fi

push-dockerfile:backend:
  <<: *common-docker-push
  stage: build-docker
  extends: [.main-backend]
  variables:
    REGISTRY: $CI_REGISTRY/kanaliiga_public/kanahub/eggosystem
  parallel:
    matrix:
      - BUILD_TYPE: [dev, production]
  script:
    - |
      if [ "$BUILD_TYPE" == "dev" ]; then
        docker buildx build \
          --cache-from type=registry,ref=$REGISTRY/eggo-backend:dev-cache \
          --cache-to type=registry,ref=$REGISTRY/eggo-backend:dev-cache,mode=max,compression=zstd \
          --build-arg CI=true \
          -t $REGISTRY/eggo-backend:dev \
          -f apps/backend/Dockerfile.dev .
      elif [ "$BUILD_TYPE" == "production" ]; then
        docker buildx build \
          --cache-from type=registry,ref=$REGISTRY/eggo-backend:latest \
          --cache-from type=registry,ref=$REGISTRY/eggo-backend:cache \
          --cache-to type=registry,ref=$REGISTRY/eggo-backend:cache,mode=max,compression=zstd \
          --build-arg CI=true \
          --push \
          -t $REGISTRY/eggo-backend:latest \
          -t $REGISTRY/eggo-backend:staging \
          -f apps/backend/Dockerfile .
      fi

push-dockerfile:migrations:
  <<: *common-docker-push
  stage: build-docker
  extends: [.main-backend]
  variables:
    REGISTRY: $CI_REGISTRY/kanaliiga_public/kanahub/eggosystem
  script:
    - docker buildx build
      --cache-from type=registry,ref=$REGISTRY/eggo-migrations:dev
      --cache-from type=registry,ref=$REGISTRY/eggo-migrations:dev-cache
      --cache-to type=registry,ref=$REGISTRY/eggo-migrations:dev-cache,mode=max,compression=zstd
      --build-arg CI=true
      --push
      -t $REGISTRY/eggo-migrations:dev
      -f apps/backend/Dockerfile.migrations.dev .

push-dockerfile:frontend:
  <<: *common-docker-push
  stage: build-docker
  extends: [.main-frontend]
  variables:
    REGISTRY: $CI_REGISTRY/kanaliiga_public/kanahub/eggosystem
  parallel:
    matrix:
      - BUILD_TYPE: [dev, staging, latest]
  script:
    - |
      if [ "$BUILD_TYPE" == "dev" ]; then
        docker buildx build \
          --cache-from type=registry,ref=$REGISTRY/eggo-frontend:dev-cache \
          --cache-to type=registry,ref=$REGISTRY/eggo-frontend:dev-cache,mode=max,compression=zstd \
          --build-arg CI=true \
          -f apps/frontend/Dockerfile.dev .
      elif [ "$BUILD_TYPE" == "staging" ]; then
        docker buildx build \
          --cache-from type=registry,ref=$REGISTRY/eggo-frontend:staging \
          --cache-from type=registry,ref=$REGISTRY/eggo-frontend:staging-cache \
          --cache-to type=registry,ref=$REGISTRY/eggo-frontend:staging-cache,mode=max,compression=zstd \
          --build-arg NEXT_PUBLIC_API_URL=https://$HUBDEV_PUBLIC_URL \
          --build-arg NEXT_PUBLIC_CLIENT_API_URL=https://$HUBDEV_PUBLIC_URL \
          --build-arg NEXT_PUBLIC_BASE_URL=https://$HUBDEV_PUBLIC_URL \
          --build-arg CI=true \
          --push \
          -t $REGISTRY/eggo-frontend:staging \
          -f apps/frontend/Dockerfile .
      elif [ "$BUILD_TYPE" == "latest" ]; then
        docker buildx build \
          --cache-from type=registry,ref=$REGISTRY/eggo-frontend:latest \
          --cache-from type=registry,ref=$REGISTRY/eggo-frontend:cache \
          --cache-to type=registry,ref=$REGISTRY/eggo-frontend:cache,mode=max,compression=zstd \
          --build-arg CI=true \
          --push \
          -t $REGISTRY/eggo-frontend:latest \
          -f apps/frontend/Dockerfile .
      fi

deploy-prod:
  image: alpine:latest
  stage: deploy
  extends: [.main-all-app]
  resource_group: production
  when: manual
  environment:
    name: production
    url: https://${HUB_PUBLIC_URL}
  variables:
    <<: *deploy-variables
  before_script:
    - "which ssh-agent || ( apk update -q && apk add openssh-client gettext rsync -q )"
    - eval $(ssh-agent -s)
    - echo "$HUB_PROD_SSH" | base64 -d | tr -d '\r' | ssh-add - > /dev/null
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan $HUB_PROD_IP >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - export PHPMYADMIN_AUTH=$(echo $PHPMYADMIN_AUTH_BASE64 | base64 -d)
    - envsubst < docker-compose.prod.yml > docker-compose.prod.subst.yml
    - envsubst < conf/mariadb/maxscale.cnf > conf/mariadb/maxscale.subst.yml
    - rsync -v ./conf/mariadb/maxscale.subst.yml ubuntu@$HUB_PROD_IP:~/docker/eggosystem/maxscale.cnf
    - rsync -v ./docker-compose.prod.subst.yml ubuntu@$HUB_PROD_IP:~/docker/eggosystem/docker-compose.yml
    - rsync -v ./conf/mariadb/my.cnf ubuntu@$HUB_PROD_IP:~/docker/eggosystem/my.cnf
    - ssh ubuntu@$HUB_PROD_IP "docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY"
    - ssh ubuntu@$HUB_PROD_IP "docker compose -f ~/docker/eggosystem/docker-compose.yml pull"
    - ssh ubuntu@$HUB_PROD_IP "docker compose -f ~/docker/eggosystem/docker-compose.yml up -d"

deploy-staging:
  image: alpine:latest
  stage: deploy
  extends: [.main-all-app]
  resource_group: staging
  environment:
    name: staging
    url: https://${HUBDEV_PUBLIC_URL}
  variables:
    <<: *deploy-variables
    ENV_ID: staging
  before_script:
    - "which ssh-agent || ( apk update -q && apk add openssh-client gettext rsync -q )"
    - eval $(ssh-agent -s)
    - echo "$HUB_PROD_SSH" | base64 -d | tr -d '\r' | ssh-add - > /dev/null
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan $HUB_DEV_IP >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - export PHPMYADMIN_AUTH=$(echo $PHPMYADMIN_AUTH_BASE64 | base64 -d)
    - envsubst < docker-compose.staging.yml > docker-compose.staging.subst.yml
    - rsync -v ./docker-compose.staging.subst.yml ubuntu@$HUB_DEV_IP:~/docker/eggosystem-staging/docker-compose.yml
    - rsync -v ./conf/mariadb/my.cnf ubuntu@$HUB_DEV_IP:~/docker/eggosystem-staging/my.cnf
    - ssh ubuntu@$HUB_DEV_IP "docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY"
    - ssh ubuntu@$HUB_DEV_IP "docker compose -f ~/docker/eggosystem-staging/docker-compose.yml pull"
    - ssh ubuntu@$HUB_DEV_IP "docker compose -f ~/docker/eggosystem-staging/docker-compose.yml up -d"
    - |
      echo ""
      echo "=============================================="
      echo "🚀 DEPLOYMENT SUCCESSFUL!"
      echo "=============================================="
      echo "📱 Frontend: https://${HUBDEV_PUBLIC_URL}"
      echo "🔌 API: https://${HUBDEV_PUBLIC_URL}/api/v1"
      echo "🗄️ phpMyAdmin: https://${HUBDEV_PUBLIC_URL}/mysadmin/"
      echo "=============================================="

deploy-ondemand:
  <<: *docker-build-base
  image: docker:28.1.1-alpine3.21
  tags:
    - hub # use this so we have whitelisted runner for portainer
  stage: on-demand-env
  needs:
    - job: build-dockerfile:backend
      artifacts: false
    - job: build-dockerfile:frontend
      artifacts: false
  allow_failure: true # Make on-demand jobs optional for merge requests
  variables:
    <<: *overwrite-variables
    REGISTRY: $CI_REGISTRY/kanaliiga_public/kanahub/eggosystem
    CACHE_TAG: ${CI_COMMIT_REF_SLUG}
  before_script:
    - apk add --no-cache gettext curl openssl jq bash
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker buildx create --use --name mybuilder --driver docker-container
    - docker buildx inspect --bootstrap
  # Build steps are kept as is due to their uniqueness
  script:
    - | # Generate private and public access tokens
      openssl genpkey -algorithm RSA -out apps/backend/private_access_token.pem && 
      openssl rsa -pubout -in apps/backend/private_access_token.pem -out apps/backend/public_access_token.pem &&
      openssl genpkey -algorithm RSA -out apps/backend/private_refresh_token.pem &&
      openssl rsa -pubout -in apps/backend/private_refresh_token.pem -out apps/backend/public_refresh_token.pem
    # Build backend mr-id image
    - docker buildx build
      --cache-from type=registry,ref=$REGISTRY/eggo-backend:latest
      --cache-from type=registry,ref=$REGISTRY/eggo-backend:cache
      --cache-from type=registry,ref=$REGISTRY/eggo-backend:${ENV_ID}
      --build-arg CI=true
      --push
      -t $REGISTRY/eggo-backend:${ENV_ID}
      -f apps/backend/Dockerfile .
    # Build backend mr-id migrations image for seeding
    - docker buildx build
      --cache-from type=registry,ref=$REGISTRY/eggo-migrations:dev
      --cache-from type=registry,ref=$REGISTRY/eggo-backend:dev-cache
      --cache-from type=registry,ref=$REGISTRY/eggo-migrations:${ENV_ID}
      --build-arg CI=true
      --push
      -t $REGISTRY/eggo-migrations:${ENV_ID}
      -f apps/backend/Dockerfile.dev .
    # Build frontend mr-id image
    - docker buildx build
      --cache-from type=registry,ref=$REGISTRY/eggo-frontend:latest
      --cache-from type=registry,ref=$REGISTRY/eggo-frontend:cache
      --cache-from type=registry,ref=$REGISTRY/eggo-frontend:staging-cache
      --cache-from type=registry,ref=$REGISTRY/eggo-frontend:${ENV_ID}
      --cache-from type=registry,ref=$REGISTRY/eggo-frontend:${ENV_ID}-cache
      --build-arg NEXT_PUBLIC_API_URL=https://hubod.kanaliiga.fi/$ENV_ID
      --build-arg NEXT_PUBLIC_CLIENT_API_URL=https://hubod.kanaliiga.fi/$ENV_ID
      --build-arg NEXT_PUBLIC_BASE_PATH=/$ENV_ID
      --build-arg NEXT_PUBLIC_BASE_URL=https://hubod.kanaliiga.fi
      --build-arg CI=true
      --push
      -t $REGISTRY/eggo-frontend:${ENV_ID}
      -f apps/frontend/Dockerfile .
    - export PHPMYADMIN_AUTH=$(echo $PHPMYADMIN_AUTH_BASE64_ONDEMAND | base64 -d)
    - if [ -z "$PORTAINER_TOKEN" ]; then echo "PORTAINER_TOKEN is empty!"; else echo "PORTAINER_TOKEN is set"; fi
    - envsubst < docker-compose.ondemand.yml > docker-compose.yml
    - echo "Deploying stack eggosystem-${ENV_ID} to Portainer at ${PORTAINER_URL}"
    - bash "$(pwd)/scripts/deploy-to-portainer.sh" docker-compose.yml
    - |
      echo ""
      echo "=============================================="
      echo "🚀 DEPLOYMENT SUCCESSFUL!"
      echo "=============================================="
      echo "📱 Frontend: https://hubod.kanaliiga.fi/${ENV_ID}"
      echo "🔌 API: https://hubod.kanaliiga.fi/${ENV_ID}/api/v1"
      echo "🗄️ phpMyAdmin: https://hubod.kanaliiga.fi/${ENV_ID}/phpmyadmin/"
      echo "🐳 Portainer: ${PORTAINER_URL}/#/stacks"
      echo "=============================================="
      echo "Environment will be available for 2 hours"
      echo "=============================================="
  environment:
    name: review/mr-$CI_MERGE_REQUEST_IID
    url: https://hubod.kanaliiga.fi/${ENV_ID}
    on_stop: stop-ondemand
    auto_stop_in: 2 hours
  artifacts:
    expire_in: 2 hours
    paths:
      - apps/backend/private_access_token.pem
      - apps/backend/public_access_token.pem
      - apps/backend/private_refresh_token.pem
      - apps/backend/public_refresh_token.pem
  rules:
    - if: $CI_MERGE_REQUEST_ID
      <<: *all-app-changes
      when: manual

stop-ondemand:
  stage: cleanup
  tags:
    - hub
  image: docker:28.1.1-alpine3.21
  allow_failure: true # Make on-demand jobs optional for merge requests
  needs: [deploy-ondemand]
  dependencies: []
  variables:
    PORTAINER_URL: $PORTAINER_URL
    PORTAINER_TOKEN: $PORTAINER_TOKEN
    ENV_ID: mr-${CI_MERGE_REQUEST_IID}
  script:
    - apk add --no-cache gettext curl jq bash
    - echo "Cleaning up stack eggosystem-${ENV_ID} from Portainer at ${PORTAINER_URL}"
    - bash "$(pwd)/scripts/cleanup-portainer-stack.sh"
    # TODO: Uncomment this when we have a way to cleanup the registry images and GitLab environment
    #- echo "Cleaning up registry images and GitLab environment"
    #- bash "$(pwd)/scripts/cleanup-registry-and-environment.sh"
  environment:
    name: review/mr-$CI_MERGE_REQUEST_IID
    action: stop
  rules:
    - if: $CI_MERGE_REQUEST_ID
      <<: *all-app-changes
      when: manual
