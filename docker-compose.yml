services:
  backend:
    image: eggo-back
    container_name: eggo-backend
    build:
      context: .
      dockerfile: ./apps/backend/Dockerfile.dev
    ports:
      - "3001:3001"
    depends_on:
      eggo-devdb:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
    volumes:
      - ./apps/backend/src:/usr/src/app/apps/backend/src # Mount source code for live reloading
    env_file: "dev.env"
    command: "pnpm --filter=backend dev"

  seed:
    image: eggo-back
    container_name: eggo-seed
    build:
      context: .
      dockerfile: ./apps/backend/Dockerfile.dev
    depends_on:
      migrations:
        condition: service_completed_successfully
    env_file: "dev.env"
    command: "pnpm --filter=backend seed"

  frontend:
    image: eggo-front
    container_name: eggo-frontend
    build:
      context: .
      dockerfile: ./apps/frontend/Dockerfile.dev
    volumes:
      - ./apps/frontend/src:/usr/src/app/apps/frontend/src # Mount source code for live reloading
      - ./packages/ui/src:/usr/src/app/packages/ui/src # Mount source code for live reloading
      - ./apps/frontend/public:/usr/src/app/apps/frontend/public # Mount source code for live reloading
    ports:
      - "3000:3000"
    depends_on:
      - backend
    command: "pnpm --filter=frontend dev"

  eggo-redis:
    image: redis:7-alpine
    restart: always
    container_name: eggo-redis

  eggo-phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: eggo-phpmyadmin
    depends_on:
      eggo-devdb:
        condition: service_healthy
    ports:
      - 8082:80
    restart: always
    environment:
      PMA_HOST: eggo-devdb
      MYSQL_ROOT_PASSWORD: dev-pass
      UPLOAD_LIMIT: 1G

  eggo-devdb:
    image: bitnami/mariadb:11.4.2
    restart: always
    container_name: eggo-devdb
    # If you need to access from own host with some other tool
    ports:
      - 6666:3306
    environment:
      - MARIADB_ROOT_PASSWORD=dev-pass
      - MARIADB_USER=kanadbuser
      - MARIADB_PASSWORD=dev-pass
      - MARIADB_DATABASE=kanaliiga
      - MARIADB_MAX_ALLOWED_PACKET=128M
      - MARIADB_INNODB_LOG_FILE_SIZE=64M
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p$$MARIADB_ROOT_PASSWORD",
        ]
      timeout: 20s
      retries: 10

  migrations:
    container_name: eggo-migrations
    image: eggo-migrations
    build:
      context: .
      dockerfile: ./apps/backend/Dockerfile.migrations.dev
    depends_on:
      eggo-devdb:
        condition: service_healthy
    env_file: "dev.env"
    ports:
      - 8485:8485
    volumes:
      - ./apps/backend/dbdump:/usr/src/app/dbdump
    command: "npx knex migrate:latest"

  backend-test:
    container_name: eggo-back-test
    image: eggo-back
    build:
      context: .
      dockerfile: ./apps/backend/Dockerfile.dev
    depends_on:
      eggo-devdb:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    env_file: "dev.env"
    volumes:
      - ./apps/backend/src:/usr/src/app/apps/backend/src
    # ports:
    #   - '8283:8080'
    command: pnpm --filter=backend test
