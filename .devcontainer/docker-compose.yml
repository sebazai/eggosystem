services:
  devcontainer:
    build: .
    container_name: devcontainer
    volumes:
      - ..:/workspace
    env_file: "../dev.env"
    command: sleep infinity
    networks:
      - eggo-dev

  eggo-devdb:
    extends:
      file: ../docker-compose.yml
      service: eggo-devdb
    networks:
      - eggo-dev
    ports:
      - 6667:3306

  eggo-phpmyadmin:
    extends:
      file: ../docker-compose.yml
      service: eggo-phpmyadmin-dev
    networks:
      - eggo-dev
    ports:
      - 8083:80

networks:
  eggo-dev:
