services:
  devcontainer:
    build: .
    container_name: devcontainer
    volumes:
      - ..:/workspace
    env_file: "../.env.development"
    command: sleep infinity
    networks:
      - eggo-dev

  eggo-devdb:
    extends:
      file: ../docker-compose.yml
      service: eggo-devdb
    networks:
      - eggo-dev

  eggo-phpmyadmin:
    extends:
      file: ../docker-compose.yml
      service: eggo-phpmyadmin-dev
    networks:
      - eggo-dev
    ports:
      - 8083:80

  eggo-redis:
    extends:
      file: ../docker-compose.yml
      service: eggo-redis
    networks:
      - eggo-dev

networks:
  eggo-dev:
