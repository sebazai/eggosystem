services:
  devcontainer:
    build: .
    container_name: devcontainer
    volumes:
      - ..:/workspace
    env_file: "../.env.development"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3001 # Override frontend API URL
    command: sleep infinity
    networks:
      - eggo-dev

  eggo-devdb:
    extends:
      file: ../docker-compose.yml
      service: eggo-devdb
    networks:
      - eggo-dev
    volumes:
      - ../conf/mariadb/my.cnf:/etc/mysql/conf.d/my.cnf
      - ../conf/mariadb/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d
    ports:
      - 3306:3306

  eggo-phpmyadmin:
    extends:
      file: ../docker-compose.yml
      service: eggo-phpmyadmin-dev
    networks:
      - eggo-dev
    ports:
      - 8083:80

  eggo-redis:
    extends:
      file: ../docker-compose.yml
      service: eggo-redis
    networks:
      - eggo-dev
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  eggo-bull-monitor:
    extends:
      file: ../docker-compose.yml
      service: eggo-bull-monitor
    networks:
      - eggo-dev
    ports:
      - 3010:3010
    depends_on:
      eggo-redis:
        condition: service_healthy

  eggo-rabbitmq:
    extends:
      file: ../docker-compose.yml
      service: eggo-rabbitmq
    networks:
      - eggo-dev
    ports:
      - 15674:15672 # Different port from main docker-compose

networks:
  eggo-dev:

volumes:
  redis-data:
    driver: local
