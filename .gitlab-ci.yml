test:backend:
  stage: test
  extends: [.only-merge-request, .pull-only-cache, .back]
  services:
    - name: bitnami/mariadb:11.4.2
      alias: eggo-devdb
  variables:
    MARIADB_ROOT_PASSWORD: dev-pass
    MARIADB_USER: kanadbuser
    MARIADB_PASSWORD: dev-pass
    MARIADB_DATABASE: kanaliiga
    MARIADB_MAX_ALLOWED_PACKET: 128M
    MARIADB_INNODB_LOG_FILE_SIZE: 64M
  before_script:
    - npm install -g pnpm
    - export $(grep -v '^#' dev.env | xargs)
    - pnpm --filter=backend migrate
    - pnpm --filter=backend seed
  script:
    - pnpm --filter=backend test

build:frontend:
  stage: build
  extends: [.only-merge-request, .pull-only-cache, .front]
  script:
    - pnpm --filter=frontend build

build:backend:
  stage: build
  extends: [.only-merge-request, .pull-only-cache, .back]
  script:
    - pnpm --filter=backend build

build-dockerfile:backend:
  image: docker:dind
  services:
  - docker:dind
  stage: build-docker
  extends: .back
  before_script:
    - echo "Jee"
  script:
    - docker compose build backend
        
build-dockerfile:frontend:
  image: docker:dind
  services:
  - docker:dind
  extends: .front
  stage: build-docker
  before_script:
    - echo "Jee"
  script:
    - docker compose build frontend