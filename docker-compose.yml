x-phpmyadmin: &phpmyadmin
  image: phpmyadmin/phpmyadmin
  depends_on:
    eggo-devdb:
      condition: service_healthy
  restart: always
  env_file: .env.base

services:
  backend:
    image: eggo-back
    build:
      context: .
      dockerfile: ./apps/backend/Dockerfile.dev
    ports:
      - "3001:3001"
    depends_on:
      eggo-devdb:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    volumes:
      - ./apps/backend/src:/usr/src/app/apps/backend/src
    env_file: .env.base
    command: "pnpm --filter=backend dev"

  seed:
    image: eggo-back
    profiles:
      - seed
    build:
      context: .
      dockerfile: ./apps/backend/Dockerfile.dev
    depends_on:
      migrations:
        condition: service_completed_successfully
    env_file: .env.base
    command: "pnpm --filter=backend seed"

  frontend:
    image: eggo-front
    build:
      context: .
      dockerfile: ./apps/frontend/Dockerfile.dev
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:3001
      - NEXT_PUBLIC_CLIENT_API_URL=http://localhost:3001
    volumes:
      - ./apps/frontend/src:/usr/src/app/apps/frontend/src # Mount source code for live reloading
      - ./apps/frontend/public:/usr/src/app/apps/frontend/public # Mount source code for live reloading
      - ./apps/frontend/node_modules:/usr/src/app/apps/frontend/node_modules # Mount source code for live reloading
    ports:
      - "3000:3000"
    depends_on:
      - backend
    command: "pnpm --filter=frontend dev"

  eggo-redis:
    image: redis:7-alpine
    restart: always

  eggo-phpmyadmin:
    <<: *phpmyadmin
    ports:
      - 8082:80

  eggo-phpmyadmin-dev:
    <<: *phpmyadmin
    profiles:
      - dev

  eggo-devdb:
    image: bitnami/mariadb:11.4.2
    restart: always
    environment:
      - MARIADB_ROOT_PASSWORD=dev-pass
      - MARIADB_USER=kanadbuser
      - MARIADB_PASSWORD=dev-pass
      - MARIADB_DATABASE=kanaliiga
      - MARIADB_MAX_ALLOWED_PACKET=128M
      - MARIADB_INNODB_LOG_FILE_SIZE=64M
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p$$MARIADB_ROOT_PASSWORD"
        ]
      timeout: 20s
      retries: 10

  migrations:
    image: eggo-migrations
    build:
      context: .
      dockerfile: ./apps/backend/Dockerfile.migrations.dev
    depends_on:
      eggo-devdb:
        condition: service_healthy
    env_file: .env.base
    ports:
      - 8485:8485
    volumes:
      - ./apps/backend/dbdump:/usr/src/app/dbdump
    command: "npx knex migrate:latest"

  backend-test:
    image: eggo-back
    profiles:
      - test
    build:
      context: .
      dockerfile: ./apps/backend/Dockerfile.dev
    depends_on:
      eggo-devdb:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
    env_file: .env.base
    volumes:
      - ./apps/backend/src:/usr/src/app/apps/backend/src
    command: pnpm --filter=backend test
