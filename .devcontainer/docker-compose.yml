services:
  devcontainer:
    build: .
    container_name: devcontainer
    mem_limit: 6g
    volumes:
      - ..:/workspace
    env_file: "../.env.development"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3001 # Override frontend API URL
      # Image Node 24 before Cursor remote-server Node (pnpm 11 needs >= 22.13)
      - PATH=/usr/local/bin:/usr/local/share/npm-global/bin:/home/node/.local/bin:/usr/local/sbin:/usr/sbin:/usr/bin:/sbin:/bin
    # Clear node image entrypoint (otherwise docker-entrypoint.sh runs `node sleep`).
    entrypoint: []
    command: ["sleep", "infinity"]
    networks:
      - eggo-dev

  eggo-devdb:
    extends:
      file: ../docker-compose.yml
      service: eggo-devdb
    mem_limit: 4g
    networks:
      - eggo-dev
    volumes:
      - ../conf/mariadb/my.cnf:/etc/mysql/conf.d/my.cnf
      - ../conf/mariadb/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d
    ports:
      - 3306:3306

  eggo-phpmyadmin:
    extends:
      file: ../docker-compose.yml
      service: eggo-phpmyadmin-dev
    mem_limit: 512m
    networks:
      - eggo-dev
    ports:
      - 8083:80

  eggo-redis:
    extends:
      file: ../docker-compose.yml
      service: eggo-redis
    mem_limit: 256m
    networks:
      - eggo-dev
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  eggo-bull-monitor:
    extends:
      file: ../docker-compose.yml
      service: eggo-bull-monitor
    mem_limit: 256m
    networks:
      - eggo-dev
    ports:
      - 3010:3010
    depends_on:
      eggo-redis:
        condition: service_healthy

  eggo-rabbitmq:
    extends:
      file: ../docker-compose.yml
      service: eggo-rabbitmq
    mem_limit: 256m
    networks:
      - eggo-dev
    ports:
      - 15674:15672 # Different port from main docker-compose

networks:
  eggo-dev:

volumes:
  redis-data:
    driver: local
