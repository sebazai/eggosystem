services:
  backend:
    image: registry.gitlab.com/kanaliiga_public/kanahub/eggosystem/eggo-backend
    pull_policy: always
    depends_on:
      eggo-prod-db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DB_HOST: eggo-prod-db
      DB_USER: ${MARIADB_USER}
      DB_PASSWORD: "${MARIADB_PASSWORD}"
      DB_NAME: ${MARIADB_DATABASE}
      DB_PORT: 3306
      FRONTEND_URL: https://${HUB_PUBLIC_URL}
      BACKEND_URL: https://${HUB_PUBLIC_URL}
      REDIS_HOST: eggo-redis
      REDIS_PORT: 6379
      STEAM_API_KEY: $STEAM_API_KEY
      JWT_SECRET: $JWT_SECRET
      JWT_REFRESH_SECRET: $JWT_REFRESH_SECRET
      OTEL_RESOURCE_ATTRIBUTES: "deployment.environment=production,service.namespace=eggosystem,service.version=1.0.0.0,service.instance.id=backend"
      OTEL_EXPORTER_OTLP_HEADERS: "api-key=${NEWRELIC_API_KEY}"
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.hubbe.entrypoints=http"
      - "traefik.http.routers.hubbe.rule=Host(`${HUB_PUBLIC_URL}`) && PathPrefix(`/api/v1`)"
      - "traefik.http.middlewares.hubbe-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.hubbe.middlewares=hubbe-https-redirect"
      - "traefik.http.routers.hubbe-secure.entrypoints=https"
      - "traefik.http.routers.hubbe-secure.rule=Host(`${HUB_PUBLIC_URL}`) && PathPrefix(`/api/v1`)"
      - "traefik.http.routers.hubbe-secure.tls=true"
      - "traefik.http.routers.hubbe-secure.tls.domains[0].main=${HUB_PUBLIC_URL}"
      - "traefik.http.routers.hubbe-secure.tls.certresolver=http"
      - "traefik.http.routers.hubbe-secure.service=hubbe"
      - "traefik.http.services.hubbe.loadbalancer.server.port=3001"
      - "traefik.docker.network=web"

  frontend:
    image: registry.gitlab.com/kanaliiga_public/kanahub/eggosystem/eggo-frontend
    pull_policy: always
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: https://${HUB_PUBLIC_URL}
      NEXT_PUBLIC_CLIENT_API_URL: https://${HUB_PUBLIC_URL}
      NEXT_PUBLIC_BASE_URL: https://${HUB_PUBLIC_URL}
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.kanahub.entrypoints=http"
      - "traefik.http.routers.kanahub.rule=Host(`${HUB_PUBLIC_URL}`)"
      - "traefik.http.middlewares.kanahub-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.kanahub.middlewares=kanahub-https-redirect"
      - "traefik.http.routers.kanahub-secure.entrypoints=https"
      - "traefik.http.routers.kanahub-secure.rule=Host(`${HUB_PUBLIC_URL}`)"
      - "traefik.http.routers.kanahub-secure.tls=true"
      - "traefik.http.routers.kanahub-secure.tls.domains[0].main=${HUB_PUBLIC_URL}"
      - "traefik.http.routers.kanahub-secure.tls.certresolver=http"
      - "traefik.http.routers.kanahub-secure.service=kanahub"
      - "traefik.http.services.kanahub.loadbalancer.server.port=3000"
      - "traefik.docker.network=web"

  eggo-prod-db:
    image: bitnami/mariadb:11.4.2
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: "${MARIADB_ROOT_PASSWORD}"
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: "${MARIADB_PASSWORD}"
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_MAX_ALLOWED_PACKET: 128M
      MARIADB_INNODB_LOG_FILE_SIZE: 64M
    networks:
      - web
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p$$MARIADB_ROOT_PASSWORD"
        ]
      timeout: 20s
      retries: 10

  eggo-prod-redis:
    image: redis:7-alpine
    networks:
      - web
    restart: always

  migrations:
    image: registry.gitlab.com/kanaliiga_public/kanahub/eggosystem/eggo-migrations
    depends_on:
      eggo-prod-db:
        condition: service_healthy
    environment:
      DB_HOST: eggo-prod-db
      DB_USER: ${MARIADB_USER}
      DB_PASSWORD: "${MARIADB_PASSWORD}"
      DB_NAME: ${MARIADB_DATABASE}
      DB_PORT: 3306
      WAIT_FOR_DB: ${KANA}
    entrypoint: ["scripts/wait-for-kanadb.sh"]
    command: "npx knex migrate:latest"
    networks:
      - web

  phpmyadmin-hub:
    depends_on:
      - eggo-prod-db
    image: phpmyadmin/phpmyadmin
    restart: always
    environment:
      PMA_HOST: eggo-prod-db
      PMA_ABSOLUTE_URI: https://${HUB_PUBLIC_URL}/mysadmin/
      UPLOAD_LIMIT: 1G
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.phpmyadmin-hub.entrypoints=http"
      - "traefik.http.routers.phpmyadmin-hub.rule=Host(`hub.kanaliiga.fi`) && PathPrefix(`/mysadmin/`)"
      - "traefik.http.middlewares.phpmyadmin-hub-stripprefix.stripprefix.prefixes=/mysadmin"
      - "traefik.http.middlewares.phpmyadmin-hub-auth.basicauth.users=${PHPMYADMIN_AUTH}"
      - "traefik.http.middlewares.phpmyadmin-hub-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.phpmyadmin-hub.middlewares=phpmyadmin-hub-https-redirect"
      - "traefik.http.routers.phpmyadmin-hub-secure.entrypoints=https"
      - "traefik.http.routers.phpmyadmin-hub-secure.rule=Host(`hub.kanaliiga.fi`) && PathPrefix(`/mysadmin/`)"
      - "traefik.http.routers.phpmyadmin-hub-secure.tls=true"
      - "traefik.http.routers.phpmyadmin-hub-secure.tls.domains[0].main=hub.kanaliiga.fi"
      - "traefik.http.routers.phpmyadmin-hub-secure.tls.certresolver=http"
      - "traefik.http.routers.phpmyadmin-hub-secure.service=phpmyadmin-hub"
      - "traefik.http.routers.phpmyadmin-hub-secure.middlewares=phpmyadmin-hub-stripprefix,phpmyadmin-hub-auth"
      - "traefik.http.services.phpmyadmin-hub.loadbalancer.server.port=80"
      - "traefik.docker.network=web"

networks:
  web:
    external: true
